    <h1 id="_1">(제뉴인)(메일전송) '첨부파일의 서버의 경로가 없습니다'</h1>
<ul>
<li>
<p>요청사항 =&gt; 청구서등록_swpc 화면에서 메일을 전송할 시, '첨부파일의 서버의 경로가 없습니다' 라는 에러가 발생하고 있습니다.</p>
</li>
<li>
<p>결과 =&gt; _TCACompanyConfig 테이블에 경로 데이터( 'D:\KsystemSWPC\FileService\upload' ) 입력</p>
</li>
</ul>
