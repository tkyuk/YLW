    <h1 id="531">5/31</h1>
<p>해당 화면에서 수량 배부 버튼 클릭하여 배부수량을 계산할 때</p>
<p>소수점 단위를 환경설정에 등록되어 있는 구매수량 소수점 단위가 아니라</p>
<p>소수점 첫째자리에서 반올림하여 계산되도록 수정요청드립니다.</p>
<p>계산된 결과값은 소수점이하는 .00으로 정수단위로 표시되어야 하며,</p>
<p>화면상에 소수점은 2자리까지 보여야 합니다.</p>
