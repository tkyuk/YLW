    <h1 id="_1">단가, 외화, 원화 소수점</h1>
<p>판매반품입력_mcnv</p>
<p>환경설정(개발자) - (운영공통) - 15번 에 설정이 되어있음</p>
<p>(운영공통)</p>
<p>원화 =&gt; 소수점 0자리</p>
<p>외화 =&gt; 소수점 4자리</p>
<p>따라서 Declength를 쓰는게 아니라</p>
<p>default 값에 밑에 값을 넣기만 하면 된다</p>
<p>ENV_DecLenFOR =&gt; 외화</p>
<p>ENV_DecLenKOR =&gt; 원화</p>
<p>베트남 화면의 경우 베트남이 원화이므로</p>
<p>바꿔써야한다</p>
<p>==&gt; 적용 후 껐다 켜야함</p>
