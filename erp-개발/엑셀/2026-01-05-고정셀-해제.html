    <h1 id="_1">고정셀 해제</h1>
<p>고정셀 해제</p>
<p><strong>1. 틀 고정 해제 단축키 (순서대로 누르세요)</strong></p>
<p>엑셀은 Alt 키를 누르면 상단 리본 메뉴에 가이드 문자가 뜹니다. 아래 순서대로 키보드를 하나씩 누르시면 됩니다.</p>
<ul>
<li><strong>Alt → W → F → F</strong></li>
</ul>
<blockquote>
<p><strong>상세 순서:</strong></p>
</blockquote>
<ol>
<li>
<p><strong>Alt</strong>: 리본 메뉴 활성화</p>
</li>
<li>
<p><strong>W</strong>: '보기(Vie<strong>w</strong>)' 탭 선택</p>
</li>
<li>
<p><strong>F</strong>: '틀 고정(<strong>F</strong>reeze Panes)' 메뉴 선택</p>
</li>
<li>
<p><strong>F</strong>: '틀 고정 취소(<strong>F</strong>reeze Panes)' 실행</p>
</li>
</ol>
<blockquote></blockquote>
<p>-</p>
