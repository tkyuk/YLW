    <h1 id="_1">영풍제지</h1>
<p>고객사 측에서 개발한 화면도 유지보수 해주는 것으로 계약이 되어있음</p>
<p>해당 화면의 경우 영풍제지 개발툴에서 수정해야함</p>
<p>-&gt; 수정하면 바로 적용이 되어서 화면 수정의 경우 테스트에만 반영이 불가능</p>
<p>원격 연결 시 헬프유로 원격 접속 후 다시 원격으로 서버 들어가야함</p>
