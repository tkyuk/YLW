    <h1 id="set-get">출력물 변수 set, get 함수 설정</h1>
<p>var gMasterKey = "";</p>
<p>/* 마스터키 설정 */</p>
<p>function setMasterKey(band, key) {</p>
<blockquote>
<p>gMasterKey = band.GetDataSetValue(key);</p>
</blockquote>
<p>}</p>
<p>/* 마스터키 조회(테스트용) */</p>
<p>function getMasterKey() {</p>
<blockquote>
<p>return gMasterKey;</p>
</blockquote>
<p>}</p>
