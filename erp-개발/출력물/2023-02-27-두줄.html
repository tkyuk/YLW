<p>오즈 제품을 사용해주셔서 감사합니다.</p>
<p>다중선을 표현하고자 하시면</p>
<p>라벨의 속성 중 '테두리 두께'의 설정을 변경하시면 됩니다.</p>
<p>[두께][여백][두께][여백].. 형식으로 설정하시면 됩니다.</p>
