    <div class="meta">
      <span class="note-date">2023-12-28</span>
      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#SQL</span>

  <article class="note-body">
    <h1 id="_1">테이블에 해당 컬럼이 존재하지 않는다면 컬럼 추가</h1>
<p>IF NOT EXISTS (SELECT * FROM sys.columns WHERE object_id = OBJECT_ID(N'[dbo].[sys_TSLCustItemPriceReqLog]') AND name='ReqDate')</p>
<p>BEGIN</p>
<p>ALTER TABLE sys_TSLCustItemPriceReqLog ADD ReqDate NCHAR(8)</p>
<p>END</p>
  </article>
