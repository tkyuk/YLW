<title>MAX값 OR 최근 등록된 건 JOIN</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<div class="container">
  <a class="back-link" href="../../index.html">&larr; 목록으로</a>
  <header class="note-header">
    <h1>MAX값 OR 최근 등록된 건 JOIN</h1>
    <div class="meta">
      <span class="note-date">2024-02-20</span>
      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#SQL</span>
    </div>
  </header>
  <article class="note-body">
    <h1 id="max-or-join">MAX값 OR 최근 등록된 건 JOIN</h1>
<p>OUTER APPLY (SELECT TOP 1 TelNo</p>
<p>FROM _TDACustEmpInfo AS Z1</p>
<p>WHERE A.CompanySeq = Z1.CompanySeq</p>
<p>AND A.CustSeq = Z1.CustSeq</p>
<p>AND Z1.UMJobRollKind = 8024001</p>
<p>AND ISNULL(Z1.TELNo,'') \&lt;&gt; ''</p>
<p>ORDER BY EmpSerl DESC</p>
<p>) AS Z1</p>
  </article>
</div>
</body>
</html>
