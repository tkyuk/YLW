    <h1 id="html-">광림 그룹웨어 html 테스트 -&gt; 실서버 반영</h1>
<p>UPDATE A</p>
<p>SET Body = B.Body</p>
<p>FROM KL.DBO._TCOMEnvGroupWare AS A</p>
<p>JOIN KLTest.DBO._TCOMEnvGroupWare AS B ON B.CompanySeq = A.CompanySeq</p>
<p>AND B.WorkKind = A.WorkKind</p>
<p>WHERE A.WorkKind IN ('Estimate1','Estimate2')</p>
