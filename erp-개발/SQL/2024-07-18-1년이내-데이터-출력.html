      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#SQL</span>

  <article class="note-body">
    <h1 id="1">1년이내 데이터 출력</h1>
<p>DATEDIFF(DAY, CONVERT(DATE, SUBSTRING(B.PODate, 1, 4) + '-' + SUBSTRING(B.PODate, 5, 2) + '-' + SUBSTRING(B.PODate, 7, 2), 120), GETDATE()) \&lt;= 365</p>
  </article>
