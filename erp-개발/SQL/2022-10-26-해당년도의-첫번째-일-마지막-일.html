    <h1 id="_1">해당년도의 첫번째 일 / 마지막 일</h1>
<p>SELECT DATEADD(YEAR, DATEDIFF(YEAR, 0, '날짜'), 0) As 'DAY_FIRST' </p>
<p>SELECT DATEADD(YEAR, DATEDIFF(YEAR, -1, '날짜'), -1) As 'DAY_LAST'</p>
