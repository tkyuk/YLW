    <h1 id="sp">특정 테이블 쓰는 sp 찾기</h1>
<p>-- 특정 테이블 쓰는 sp 찾기</p>
<p>SELECT</p>
<p>DISTINCT O.NAME</p>
<p>FROM</p>
<p>SYSDEPENDS AS D</p>
<p>INNER JOIN</p>
<p>SYSOBJECTS AS O</p>
<p>ON</p>
<p>D.ID = O.ID</p>
<p>WHERE</p>
<p>O.XTYPE = 'P'</p>
<p>AND D.DEPID =</p>
<p>(</p>
<p>SELECT</p>
<p>ID</p>
<p>FROM</p>
<p>SYSOBJECTS</p>
<p>WHERE</p>
<p>NAME = '_TXPRWkItemBasicInfo'</p>
<p>)</p>
  </article>
