    <div class="meta">
      <span class="note-date">2023-12-06</span>
      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#SQL</span>
    </div>
  </header>
  <article class="note-body">
    <h1 id="_-charindex">_/ CHARINDEX</h1>
<p>WHILE (1=1)</p>
<p>BEGIN</p>
<p>INSERT #Item (ItemSeq)</p>
<p>SELECT SUBSTRING(@GoodItemSeq, @Tmp, CHARINDEX('_/', @GoodItemSeq, @Tmp) - @Tmp)</p>
<p>SELECT @Tmp = CHARINDEX('_/', @GoodItemSeq, @Tmp) + 2</p>
<p>IF @Tmp &gt; LEN(@GoodItemSeq)</p>
<p>BREAK</p>
<p>END</p>
  </article>
