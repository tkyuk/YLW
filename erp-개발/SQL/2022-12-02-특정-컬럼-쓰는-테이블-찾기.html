  <article class="note-body">
    <h1 id="_1">특정 컬럼 쓰는 테이블 찾기</h1>
<p>--특정 컬럼 쓰는 테이블 찾기</p>
<p>SELECT</p>
<p>T.name AS table_name, C.name AS column_name</p>
<p>FROM sys.tables AS T</p>
<p>INNER JOIN sys.columns AS C ON T.object_id = C.object_id</p>
<p>WHERE C.name = 'SqlScriptSeq'</p>
<p>ORDER BY table_name</p>
  </article>
</div>
