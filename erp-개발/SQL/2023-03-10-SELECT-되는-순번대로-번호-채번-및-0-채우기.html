    <div class="meta">
      <span class="note-date">2023-03-10</span>
      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#SQL</span>

  <article class="note-body">
    <h1 id="select-0">SELECT 되는 순번대로 번호 채번 및 0 채우기</h1>
<p>ROW_NUMBER() OVER(ORDER BY (SELECT 1)</p>
<p>RIGHT('00' + CAST(ROW_NUMBER() OVER(ORDER BY (SELECT 1)) AS NVARCHAR), 2)</p>
<p>RIGHT('000' + CAST(99 AS NVARCHAR), 3)</p>
  </article>
