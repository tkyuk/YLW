    <h1 id="_1">점프 화면 조회</h1>
<p>select b.custseq,b.caption,b.PgmId,* from _TCAPgmEvent as a </p>
<p>join _TCAPgm as b on a.pgmseq = b.pgmseq</p>
<p>where a.jumppgmseq = 500145</p>
<p>and b.custseq = 3101581</p>
<p>EventType = 21 은 진행 Jump라서 따로 진행 추가</p>
