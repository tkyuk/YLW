    <h1 id="_1">메뉴등록</h1>
<p>코드관리(개발자) - 프로세스메뉴 - 프로세스메뉴조회</p>
<p>프로세스메뉴명 : %추가 or %엠씨</p>
<p>더블클릭 후 '프로세스메뉴등록' 눌러서 점프</p>
<p>프로그램 =&gt; 복붙 하면 자동으로 프로그램 ID도 나옴</p>
<p>표시명 = 프로그램명 복사</p>
<p>표시구분 = 위에 복붙</p>
<p>아이콘 추가 체크</p>
