    <h1 id="_1">조회모음</h1>
<p>조회모음 (입력 등 다른거 불가능하고 조회만 가능)</p>
<blockquote>
<p>- SP로만 굴러가는 화면, 현황화면</p>
<p>(Save, Check없고 Query SP만 있음)</p>
<p>- ylwa 로 시작함 (ylwa00000_jsb, SCTQry_ylwa00000_jsb)</p>
<p>ylwa + 숫자 5자리 + _업체명</p>
</blockquote>
<p>ylwa 00000 _jsb</p>
<blockquote>
<p>SP는 앞에 SCTQry_ 가 붙는다</p>
<p>SP명 : SCTQry_ylwa00000_jsb</p>
</blockquote>
