<body>
<div class="container">
  <a class="back-link" href="../../index.html">&larr; 목록으로</a>
  <header class="note-header">
    <h1>시트행 A 만큼 값 출력</h1>
    <div class="meta">
      <span class="note-date">2022-12-08</span>
      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#Ace이벤트</span>
    </div>
  </header>
  <article class="note-body">
    <h1 id="a">시트행 A 만큼 값 출력</h1>
<p>local row, TotalCount</p>
<p>TotalCount = 0</p>
<p>for row = 0, SS1.DataRowCnt-1 do        </p>
<blockquote>
<p>SS1.ActiveRow = row</p>
<p>if SS1.WorkingTag == 'A' then</p>
<p>TotalCount = TotalCount + 1</p>
<p>end        </p>
</blockquote>
<p>fltResultCopyRow.Value = TotalCount</p>
<p>end</p>
  </article>
</div>
</body>
