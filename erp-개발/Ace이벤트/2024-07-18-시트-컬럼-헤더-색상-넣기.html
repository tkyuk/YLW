  <header class="note-header">
    <h1>시트 컬럼 헤더 색상 넣기</h1>
    <div class="meta">
      <span class="note-date">2024-07-18</span>
      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#Ace이벤트</span>
    </div>
  </header>
  <article class="note-body">
    <h1 id="_1">시트 컬럼 헤더 색상 넣기</h1>
<p>local col</p>
<p>for col = 0, SS1.MaxCols - 1 do</p>
<blockquote>
<p>SS1.ActiveCol = col</p>
<p><span class="mark">SS1.ColumnHeaderRowIndex = 1</span></p>
<p>if SS1.ColumnHeaderText == '온도계수' then</p>
<p>SetColumnHeaderForeColor(SS1, <span class="mark">1</span>, SS1.ActiveColumnName, -65536, true)</p>
<p>end</p>
</blockquote>
<p>end</p>
<p>=&gt; 투헤더의 2번째 행 기준</p>
  </article>
</div>
</body>
