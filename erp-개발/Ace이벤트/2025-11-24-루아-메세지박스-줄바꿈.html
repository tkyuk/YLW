    <h1 id="_1">루아 메세지박스 줄바꿈</h1>
<p>local msg1 = '[일비/숙박비/연박비의 경우 [계산] 버튼을 통해 자동계산 됩니다.'</p>
<p>local msg2 = '[계산] 버튼을 누르셨습니까?'</p>
<p>local message = msg1 .. '\n' .. msg2</p>
<p>rtnType = MessageBox(message,'', 'MsgBoxTypeYesNo')</p>
<p>if rtnType ~= 1 then</p>
<blockquote>
<p>GoTo('END')</p>
<p>return</p>
</blockquote>
<p>end</p>
