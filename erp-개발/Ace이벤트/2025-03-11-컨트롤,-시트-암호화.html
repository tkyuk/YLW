    <h1 id="_1">컨트롤, 시트 암호화</h1>
<p><strong>컨트롤 암호화</strong></p>
<p>Init() 이벤트에 Lua로 설정합니다. 텍스트, 마스크, 패스워드 컨트롤에 사용합니다. </p>
<p>ex. ctl.IsCodeEncryption = true</p>
<p><strong>시트 암호화</strong></p>
<p>Init() 이벤트에 Lua로 작성합니다.</p>
<p>SS1.ActiveColumnName = 'ResiID'</p>
<p>SS1.IsCodeEncryption = true -- IsCodeEncryption는 ActiveColumn의 암호화 여부를 변경합니다.</p>
