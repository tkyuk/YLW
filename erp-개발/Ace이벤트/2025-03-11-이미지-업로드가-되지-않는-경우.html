    <h1 id="_1">이미지 업로드가 되지 않는 경우</h1>
<p><strong>기능 설명</strong></p>
<p>지원하지 않는 확장자의 경우 이미지 업로드가 되지 않습니다.</p>
<ul>
<li>
<p>제뉴인은 모든 확장자 지원</p>
</li>
<li>
<p>ACE 지원 이미지 확장자: GIF, JPEG, JPG, PNG, BMP</p>
</li>
</ul>
<blockquote></blockquote>
<p>ACE의 경우 위 5개의 확장자만 지원되기 때문에 다른 확장자의 경우 변환하여 업로드하면 됩니다.</p>
  </article>
