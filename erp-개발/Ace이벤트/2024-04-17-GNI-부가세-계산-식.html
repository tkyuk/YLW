    <h1 id="gni">GNI 부가세 계산 식</h1>
<p>부가세 포함 체크 시 -&gt; ROUND((수량 * 단가) - (수량 * 단가 * 10/11), 0) / 합계금액 -&gt;수량 * 단가</p>
<p>부가세 포함 미체크 -&gt; ROUND((수량*단가*0.1), 0) / 합계금액 -&gt; 수량*단가+부가세</p>
<p><img alt="" src="assets/GNI-부가세-계산-식/image80.png" /></p>
