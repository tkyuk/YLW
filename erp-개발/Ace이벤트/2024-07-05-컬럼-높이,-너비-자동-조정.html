<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>컬럼 높이, 너비 자동 조정</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body>
<div class="container">
  <a class="back-link" href="../../index.html">&larr; 목록으로</a>
  <header class="note-header">
    <h1>컬럼 높이, 너비 자동 조정</h1>
    <div class="meta">
      <span class="note-date">2024-07-05</span>
      <span class="tag">#erp</span><span class="tag">#개발</span><span class="tag">#Ace이벤트</span>
    </div>
  </header>
  <article class="note-body">
    <h1 id="_1">컬럼 높이, 너비 자동 조정</h1>
<p>local row</p>
<p>for row = 0, SS1.DataRowCnt -1 do</p>
<blockquote>
<p>if CellText(SS1, row, 'OrderText') ~= '' then</p>
<p>SS1.ActiveRow = row</p>
<p>SS1.SetAutoWidthColumn(ColXName(SS1, 'OrderText')); -- 너비</p>
<p>SS1.SetAutoHeightRow(row); -- 높이</p>
<p>end</p>
</blockquote>
<p>end</p>
  </article>
</div>
</body>
</html>
