  <article class="note-body">
    <h1 id="a">'A' 신규 행 존재하는 경우 에러</h1>
<p>for row = 0 , SS2.DataRowCnt - 1 do</p>
<blockquote>
<p>SS2.ActiveRow = row</p>
<p>if SS2.WorkingTag == 'A'        then</p>
<p>MessageBox('기준정보 불러온 데이터가 존재합니다.', '오류', 'MsgBoxTypeOK')</p>
<p>GoTo('END')</p>
<p>return</p>
<p>end</p>
</blockquote>
<p>end</p>
  </article>
